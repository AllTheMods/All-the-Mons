[socketSystem]
	#Master switch for Apokinetics machine sockets.
	enabled = true
	#Default sockets on compatible Create machines.
	# Default: 4
	# Range: 0 ~ 4
	defaultSocketCount = 4
	#Hard cap for sockets any single machine can expose.
	# Default: 4
	# Range: 1 ~ 4
	globalSocketCap = 4
	#Drops socketed gems only when a broken machine has no dropped machine item that can retain them.
	dropSocketedGemsOnBreak = true
	#Create machine block ids that cannot be socketed, e.g. create:mechanical_drill.
	disabledMachines = []
	#Per-machine socket counts as block_id=count, e.g. create:mechanical_drill=2.
	machineSocketCounts = []
	#Optional per-machine gem overrides as block_id=gem,gem, e.g. create:encased_fan=impact,extension,frostwork.
	machineAllowedGems = []
	#Per-machine multipliers applied to every gem effect as block_id=multiplier.
	#1.0 is unchanged, values between 0 and 1 weaken effects, and 0 disables their strength.
	machineEffectiveness = []
	#When true, Velocity increases a machine's stress impact by the same multiplier as its speed bonus.
	#Equilibrium reduction is applied after this increase.
	velocityAddsStress = false

[antiDuplication]
	#Master switch for Precision preservation and Yielding bonus-output hooks.
	allowBonusOutputs = false
	#When true, Yielding never copies non-stackable recipe outputs.
	yieldingStackableOutputsOnly = true

	[processing.fan]
		#Scales Velocity's real fan-processing timer bonus. 1.0 uses the full configured gem effect.
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		velocityScale = 1.0
		#Scales Ignition's real fan-processing timer bonus independently of Velocity.
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		ignitionScale = 1.0
		#Minimum base fan-processing time after Apokinetics speed bonuses.
		# Default: 1
		# Range: 1 ~ 72000
		minimumTicks = 1

	[processing.fluidMachines]
		#Scales Flowing's Spout and Item Drain cycle-speed contribution.
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		flowingScale = 1.0
		#Scales Ignition's Spout and Item Drain cycle-speed contribution.
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		ignitionScale = 1.0
		#Minimum Spout and Item Drain cycle time after Apokinetics speed bonuses.
		# Default: 5
		# Range: 1 ~ 72000
		minimumTicks = 5

	[processing.crushingWheelPair]
		#Multiplier applied to the shared gems of a valid Crushing Wheel pair.
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		effectiveness = 1.0

	[processing.generators]
		#Scales Flowing's generated-RPM contribution on supported kinetic generators.
		#1.0 is unchanged and 0 disables only this use of Flowing.
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		flowingScale = 1.0
		#Scales Ignition's generated-RPM contribution on supported kinetic generators.
		#1.0 is unchanged and 0 disables only this use of Ignition.
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		ignitionScale = 1.0

	[processing.ignition]
		#Scales Ignition's Blaze Burner fuel-duration bonus.
		#1.0 is unchanged and 0 disables fuel extension without disabling other Ignition effects.
		# Default: 1.0
		# Range: 0.0 ~ 1000000.0
		fuelEfficiencyScale = 1.0

	[processing.momentum]
		#Generated-RPM bonus per effective Momentum level. 0.08 means +8% per level.
		# Default: 0.08
		# Range: 0.0 ~ 1000000.0
		generatorBonusPerLevel = 0.08
		#Maximum generated-RPM bonus from Momentum. 1.0 means +100%.
		# Default: 1000000.0
		# Range: 0.0 ~ 1000000.0
		generatorMaximumBonus = 1000000.0

[performance]
	#Ticks to cache unchanged generator gem calculations. Zero disables time-based caching.
	# Default: 20
	# Range: 0 ~ 72000
	generatorBonusCacheTicks = 20

	[stacking.ignition]
		#Relative Ignition strength of the second strongest matching socket.
		# Default: 0.8
		# Range: 0.0 ~ 1000000.0
		secondSocketWeight = 0.8
		#Relative Ignition strength of the third strongest matching socket.
		# Default: 0.6
		# Range: 0.0 ~ 1000000.0
		thirdSocketWeight = 0.6
		#Relative Ignition strength of the fourth strongest matching socket.
		# Default: 0.4
		# Range: 0.0 ~ 1000000.0
		fourthSocketWeight = 0.4
		#Multiplicative weight falloff for Ignition sockets beyond the fourth.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		extraSocketFalloff = 0.5

[frostwork]
	#Enables the Frostwork recipe type and JEI category.
	enabled = true
	#Legacy-named percentage scale for recipe-authored Frostwork duration. 100 is unchanged, 50 is twice as fast.
	# Default: 100
	# Range: 5 ~ 72000
	processingTicks = 100
	#Radius around a Frostwork-processed loose item used to find other recipe ingredients.
	# Default: 1.65
	# Range: 0.0 ~ 128.0
	ingredientSearchRadius = 1.65
	#Maximum multi-ingredient Frostwork crafts completed in one fan-processing completion.
	# Default: 64
	# Range: 1 ~ 65536
	maxCraftsPerCompletion = 64
	#Slowness duration refreshed on living entities inside Frostwork air currents. Zero disables Slowness.
	# Default: 25
	# Range: 0 ~ 72000
	slowDurationTicks = 25
	#Slowness amplifier applied by Frostwork air currents. Zero is Slowness I.
	# Default: 0
	# Range: 0 ~ 255
	slowAmplifier = 0
	#Freeze ticks added to living entities per Frostwork air-current tick. Zero disables freezing.
	# Default: 3
	# Range: 0 ~ 72000
	freezeTicksPerTick = 3
	#Block ids treated as cold sources by Apokinetics Frostwork.
	coldSourceBlocks = ["minecraft:ice", "minecraft:packed_ice", "minecraft:blue_ice", "minecraft:snow_block", "minecraft:powder_snow"]

[momentum]
	#Enables the Momentum recipe type and JEI category.
	enabled = true
	#Minimum absolute belt speed required for Momentum processing. Zero removes the speed floor.
	# Default: 32.0
	# Range: 0.0 ~ 1000000.0
	minimumBeltSpeed = 32.0
	#Maximum ticks an item ejected from a Momentum Belt retains its captured RPM while seeking recipe inputs.
	# Default: 80
	# Range: 5 ~ 72000
	processingTicks = 80
	#Radius around an ejected Momentum item used to find other tagged recipe ingredients.
	# Default: 1.65
	# Range: 0.0 ~ 128.0
	ingredientSearchRadius = 1.65
	#Maximum multi-ingredient Momentum crafts one ejected item may complete in a tick.
	# Default: 64
	# Range: 1 ~ 65536
	maxCraftsPerTick = 64

[factoryLocator]
	#Maximum distance in blocks at which Factory Locator item highlights are visible.
	# Default: 32
	# Range: 4 ~ 256
	highlightRange = 32

[factoryScanner]
	#Radius in blocks scanned by the Factory Scanner when used or refreshed.
	# Default: 128
	# Range: 4 ~ 256
	scanRadius = 128
	#Maximum loaded block entities inspected by one Factory Scanner scan.
	# Default: 65000
	# Range: 1024 ~ 250000
	maxScannedBlocks = 65000
	#Minimum ticks between Factory Scanner uses or client refresh requests.
	# Default: 10
	# Range: 1 ~ 72000
	refreshCooldownTicks = 10

[rupture]
	#Ticks between fallback Rupture contact checks for living entities.
	# Default: 5
	# Range: 1 ~ 72000
	contactCheckIntervalTicks = 5
	#Base damage dealt by the fallback contact hook before Rupture's multiplier. Zero disables this damage.
	# Default: 1.0
	# Range: 0.0 ~ 1000000.0
	baseContactDamage = 1.0
	#Per-entity cooldown after successful fallback Rupture contact damage. Zero disables the cooldown.
	# Default: 20
	# Range: 0 ~ 72000
	contactDamageCooldownTicks = 20
	#Extra collision-box inflation used by fallback Rupture contact detection.
	# Default: 0.08
	# Range: 0.0 ~ 16.0
	contactBoundsInflation = 0.08

[kineticPylon]
	#Radius in blocks scanned and affected by the Kinetic Pylon.
	# Default: 24
	# Range: 1 ~ 128
	radius = 24
	#How often the Kinetic Pylon rescans nearby Apothic Enchanting energy sources.
	# Default: 80
	# Range: 5 ~ 72000
	scanIntervalTicks = 80
	#Legacy option. Kinetic Pylons no longer stack; the strongest single pylon applies.
	stackingMode = "highest"
	#Legacy option kept for existing configs. Pylon bonuses are no longer additive.
	# Default: 60.0
	# Range: 0.0 ~ 60.0
	stackingCapPercent = 60.0

	[kineticPylon.performance]
		#Fallback interval for detecting in-place socket/component changes on Quanta-affected player equipment.
		#Normal equipment-change events still refresh immediately.
		# Default: 5
		# Range: 1 ~ 72000
		quantaRefreshIntervalTicks = 5
		#Maximum block positions one Kinetic Pylon examines per tick while a scan is in progress.
		#Scans continue across ticks; lowering this smooths tick time at the cost of slower refreshes.
		# Default: 4096
		# Range: 64 ~ 1000000
		scanBlocksPerTick = 4096
		#Maximum nearby kinetic block entities inspected for network linking during one completed Pylon scan.
		# Default: 4096
		# Range: 0 ~ 65536
		maxKineticCandidates = 4096
		#Maximum source positions retained per Pylon for particles, persistence, and client updates.
		#Energy totals and source counts still include every scanned source. Zero disables retained source links.
		# Default: 512
		# Range: 0 ~ 8192
		maxRetainedSourceLinks = 512
		#Maximum derived affected-machine positions retained per Pylon for persistence and client updates.
		#Every affected kinetic network still receives the configured Pylon effect. Zero disables this derived list.
		# Default: 1024
		# Range: 0 ~ 16384
		maxDerivedMachineLinks = 1024
		#Maximum redundant physical member anchors remembered for each Pylon/network pair.
		#One anchor is sufficient to associate the network; additional anchors improve removal churn tolerance.
		# Default: 16
		# Range: 1 ~ 1024
		maxAnchorsPerNetwork = 16

	[kineticPylon.buffs]
		#Maximum stress impact reduction percentage at 100 Eterna energy.
		# Default: 60.0
		# Range: 0.0 ~ 100.0
		eternaStressReductionPercent = 60.0
		#Maximum generated stress capacity bonus percentage at 100 Arcana energy.
		# Default: 60.0
		# Range: 0.0 ~ 1000000.0
		arcanaCapacityPercent = 60.0
		#Maximum runtime-only stat bonus percentage for non-machine Apotheosis gems used by nearby players at 100 Quanta energy.
		# Default: 60.0
		# Range: 0.0 ~ 1000000.0
		quantaGemPercent = 60.0

	[kineticPylon.activation]
		#Additional block ids, block item ids, or #block_tags that count as Kinetic Pylon Eterna sources.
		#Apothic Enchanting stat blocks are detected automatically; this list is an override/fallback.
		eternaSources = ["minecraft:bookshelf", "#minecraft:enchantment_power_provider"]
		#Additional block ids, block item ids, or #block_tags that count as Kinetic Pylon Arcana sources.
		#Apothic Enchanting stat blocks are detected automatically; this list is an override/fallback.
		arcanaSources = []
		#Additional block ids, block item ids, or #block_tags that count as Kinetic Pylon Quanta sources.
		#Apothic Enchanting stat blocks are detected automatically; this list is an override/fallback.
		quantaSources = []

[rotation]
	#Allows Apokinetics machine gems to gain and use Rotation from the Apokinetic Table.
	affectApokineticsGems = true
	#Allows non-Apokinetics Apotheosis gems to gain and use Rotation from the Apokinetic Table.
	affectApotheosisGems = true
	#Numeric gem stat multiplier gained per Rotation level. 0.01 means +1% per level.
	# Default: 0.01
	# Range: 0.0 ~ 10.0
	bonusPerLevel = 0.01
	#Base Create stress impact of the Apokinetic Table at 1 RPM.
	#A fresh or Rotation Level 1 gem uses this base value.
	# Default: 16.0
	# Range: 0.0 ~ 1024.0
	tableStressImpact = 16.0
	#Multiplies Apokinetic Table stress impact once for each Rotation level above Level 1.
	#The default reaches about 150,000 stress units at Level 100 when the table runs at 256 RPM.
	# Default: 1.037039421527765
