	[machine.general]
		#If the crafting interface should validate recipes on insertion.
		validateRecipesCraftingInterface = true
		#The maximum amount of crafting jobs that could be scheduled within one crafting interface without being started
		maxPendingCraftingJobs = 256
		#Enabling this option will log all recipe validation failures in crafting interfaces into the server logs
		logRecipeValidationFailures = true
		#The minimal update frequency in ticks to use for crafting interfaces.
		minCraftingInterfaceUpdateFreq = 5
		#The number of ticks after which a measured crafting duration is forgotten, so that estimations follow changes to the network. Set to 0 to never forget them.
		craftingInterfaceRecipeDurationMaxAge = 144000
		#The maximum number of recipes that a crafting interface remembers crafting durations for, which are used to estimate the duration of crafting jobs. Set to 0 to disable recipe-specific estimations.
		craftingInterfaceRecipeDurationEntries = 32
		#The maximum number of recipes that will be read from a list inside an enumerated crafting interface. Set to 0 for no limit.
		maxCraftingInterfaceEnumeratedRecipes = 4096
		#The minimal update frequency in ticks to use for enumerated crafting interfaces.
		minCraftingInterfaceEnumeratedUpdateFreq = 20
		#The minimal number of ticks between two recipe list reloads in enumerated crafting interfaces, which happen when the list variable changes. Reading a list of recipes is more expensive than reading a single recipe, so this defaults higher than the update frequency.
		minCraftingInterfaceEnumeratedRecipeReloadFreq = 20
		#The minimal update frequency in ticks to use for attuned crafting interfaces.
		minCraftingInterfaceAttunedUpdateFreq = 5

	[general.general]
		#The base energy usage for the crafting interface per crafting job being processed.
		interfaceCraftingBaseConsumption = 5
		#The base energy usage for the crafting writer.
		craftingWriterBaseConsumption = 1
		#The base energy usage for the attuned crafting interface per crafting job being processed.
		interfaceCraftingAttunedBaseConsumption = 10
		#The base energy usage for the enumerated crafting interface per crafting job being processed.
		interfaceCraftingEnumeratedBaseConsumption = 10

	[core.general]
		#If an anonymous mod startup analytics request may be sent to our analytics service.
		analytics = false
		#If the version checker should be enabled.
		versionChecker = false
